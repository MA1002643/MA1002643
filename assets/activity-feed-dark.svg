<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Recent GitHub activity for MA1002643, refreshed daily. No public activity in the last 30 days." viewBox="0 0 1200 182" width="1200" height="182" preserveAspectRatio="xMidYMid meet" text-rendering="geometricPrecision">
  <title>Recent GitHub activity — live feed</title>
  <desc>Auto-generated event stream for @MA1002643: color-coded timeline of pushes, pull requests, branches, and releases, re-rendered daily by a GitHub Action.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="182" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1E293B" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%"  stop-color="#FF652F" stop-opacity="0.07"/>
      <stop offset="60%" stop-color="#FF652F" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FF652F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF652F"/>
      <stop offset="100%" stop-color="#FFC857"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="1" y="1" width="1198" height="180" rx="16"/></clipPath>
    <style>@media (prefers-reduced-motion: reduce){ * { animation:none !important; transition:none !important } }</style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="1" y="1" width="1198" height="180" fill="url(#bg)"/>
    <rect x="1" y="1" width="1198" height="180" fill="url(#grid)" opacity="0.22"/>
    <rect x="1" y="1" width="1198" height="180" fill="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="1198" height="180" rx="16" fill="none" stroke="#243042" stroke-width="1.5"/>

  <!-- header -->
  <g opacity="0" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', 'Cascadia Code', Menlo, Consolas, monospace">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.15s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
    <circle cx="44" cy="41" r="4.5" fill="#3FB950">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <text x="58" y="45" font-size="11.5" letter-spacing="2" fill="#3FB950">LIVE</text>
    <text x="112" y="45" font-size="11" letter-spacing="1.5" fill="#64748B">· EVENT STREAM — @MA1002643</text>
    <text x="1160" y="45" font-size="11" letter-spacing="1" fill="#64748B" text-anchor="end">LAST SYNC · 26 SEPT 2026, 08:28 UTC</text>
    <line x1="40" y1="64" x2="1160" y2="64" stroke="#243042" stroke-width="1" opacity="0.8"/>
    <rect x="40" y="62.5" width="0" height="3" rx="1.5" fill="url(#acc)">
      <animate attributeName="width" values="0;96" dur="0.5s" begin="0.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
    </rect>
  </g>

  <!-- timeline -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.25s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
    
  </g>

  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif">

    <text x="56" y="109" font-size="14.5" font-style="italic" fill="#9DA9B8">No public activity in the last 30 days — heads-down on longer-running work.</text>
  </g>

  <!-- footer -->
  <g opacity="0" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', 'Cascadia Code', Menlo, Consolas, monospace" font-size="11">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.44s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
    <line x1="40" y1="136" x2="1160" y2="136" stroke="#243042" stroke-width="1" opacity="0.8"/>
    <text x="40" y="162" fill="#64748B" textLength="482" lengthAdjust="spacingAndGlyphs">$ gh api /users/MA1002643/events --window 30d | render --svg --theme dark</text>
    <rect x="530" y="152" width="7" height="13" fill="#FF652F">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="1160" y="162" fill="#64748B" text-anchor="end">showing 0 of 0 events · refreshed every morning</text>
  </g>
</svg>
